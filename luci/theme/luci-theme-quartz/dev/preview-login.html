<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>luci-theme-quartz · 登录页预览（dev）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../htdocs/luci-static/quartz/cascade.css">
<script>
(function () {
	var q = new URLSearchParams(location.search);
	var t = q.get('theme') || 'auto';
	var r = document.documentElement;
	var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
	r.setAttribute('data-darkmode', dark ? 'true' : 'false');
	r.setAttribute('data-qz-mode', (t === 'dark' || t === 'light') ? t : 'auto');
	/* 登录页预览默认开壁纸（品牌时刻）；绝对路径见 DESIGN.md §4 */
	if (q.get('wallpaper') !== 'none') {
		r.setAttribute('data-qz-wallpaper', '');
		r.style.setProperty('--qz-wallpaper-on', "url('/dev/wallpaper-sample.svg')");
	}
})();
</script>
</head>

<body class="lang_zh-cn qz-blank">
<!-- 模拟 sysauth.ut + view/quartz/sysauth.js 的最终 DOM -->
<div id="modal_overlay">
	<div class="modal login" role="dialog" aria-modal="true">
		<div class="qz-login-brand">
			<span>
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
					<path d="M12 1 L19 5.5 V18.5 L12 23 L5 18.5 V5.5 Z"/>
					<path d="M5 5.5 H19"/>
					<path d="M12 1 V23" opacity=".45"/>
				</svg>
			</span>
			<div class="qz-brand-word">QuartzWrt</div>
		</div>
		<h4>Authorization Required</h4>
		<form class="cbi-map">
			<div class="cbi-value">
				<label class="cbi-value-title">用户名</label>
				<div class="cbi-value-field"><input type="text" value="root" autocomplete="username"></div>
			</div>
			<div class="cbi-value">
				<label class="cbi-value-title">密码</label>
				<div class="cbi-value-field"><input type="password" value="password" autocomplete="current-password"></div>
			</div>
		</form>
		<button class="btn cbi-button-positive important">登录</button>
	</div>
</div>

<div class="qz-preview-bar" style="position:fixed;right:16px;bottom:16px;z-index:990;display:flex;gap:6px;padding:8px 12px;border-radius:12px;background:var(--qz-bg-panel);border:1px solid var(--qz-border);box-shadow:var(--qz-shadow-raised);font-size:12.5px">
	<a class="cbi-button" href="preview.html">← 返回仪表盘预览</a>
	<a class="cbi-button" href="preview-login.html?theme=light">浅色</a>
	<a class="cbi-button" href="preview-login.html?theme=dark&wallpaper=none">深色 · 无壁纸</a>
</div>
</body>
</html>
