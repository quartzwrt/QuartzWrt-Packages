config screen 'main'
	option enabled '1'
	option brightness '80'
	option theme 'dark'
	option lang 'auto'
	option rotate '0'
	option interval '8'
	list pages 'overview'
	list pages 'network'
	list pages 'cellular'
	list pages 'system'
	option title ''
	option operator 'auto'
	option temp_unit 'c'
	option clock_24h '1'
	option show_ipv6 '1'
	option show_peaks '1'
	option show_clients '1'
	option fb 'auto'
	option backlight 'auto'
	option status_file '/var/run/quartz/status.json'

config night 'night'
	option enabled '1'
	option start '23:00'
	option end '07:00'
	option brightness '10'
	option off '0'

config note 'note'
	option title ''
	option operator 'auto'
	option line1 ''
	option line2 ''
	option line3 ''
	option line4 ''
