# quartz-daemon 配置（WP-4 / DESIGN §6）
# 修改后执行：uci commit quartz-daemon && /etc/init.d/quartz-daemon reload
# 缺失文件或缺失项一律使用内置默认值；非法值自动收敛到合法范围。

config daemon 'main'
	option interval '2'        # 采集周期（秒），范围 1-300
	option listen '127.0.0.1'  # HTTP 监听地址（回环；对外认证归 WP-5）
	option port '8899'         # HTTP 端口，范围 1-65535
